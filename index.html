<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLUORITE Official</title>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  color:white;
  text-align:center;
  background:black;
  overflow:hidden;
}

/* ===== 背景グラデーション ===== */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:
    radial-gradient(circle,#ff0088 0%,transparent 40%),
    radial-gradient(circle,#ff66cc 0%,transparent 40%);
  animation:bgmove 10s infinite alternate;
  z-index:-2;
}

@keyframes bgmove{
  from{transform:translate(-10%,-10%)}
  to{transform:translate(10%,10%)}
}

/* ===== ネオン文字 ===== */
h1{
  font-size:3em;
  margin-top:80px;
  color:#ff66cc;
  text-shadow:
  0 0 10px #ff0088,
  0 0 20px #ff0088,
  0 0 40px #ff0088;
}

/* ===== ボタン ===== */
a.button{
  display:block;
  width:260px;
  margin:20px auto;
  padding:15px;
  text-decoration:none;
  color:white;
  border:2px solid #ff0088;
  border-radius:30px;
  transition:0.3s;
}

a.button:hover{
  background:#ff0088;
  box-shadow:0 0 20px #ff0088;
}

/* ===== カウンター ===== */
.counter{
  margin-top:40px;
  font-size:18px;
}

/* ===== ハート ===== */
.heart{
  position:fixed;
  color:#ff66cc;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(100vh);
    opacity:0;
  }
}
</style>
</head>

<body>

<h1>FLUORITE</h1>

<a class="button"
href="https://marshmallow-qa.com/k36ki5d2nkkqa1b"
target="_blank">
💌 マシュマロ
</a>

<a class="button"
href="https://novel.prcm.jp/user/F9N9JLj5YvgFuKa6TrPAh7sjOAF2"
target="_blank">
📖 プリ小説
</a>

<div class="counter">
👀 Visitors:
<img src="https://hitwebcounter.com/counter/counter.php?page=12345678&style=0006&nbdigits=6&type=page&initCount=0"/>
</div>

<p style="margin-top:40px;">
Contact : fluorite453@gmail.com
</p>

<script>

/* ===== ハート降らせる ===== */
setInterval(()=>{
  const heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="❤";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(10+Math.random()*20)+"px";
  heart.style.animationDuration=(3+Math.random()*5)+"s";
  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),8000);
},300);

/* ===== マウス光 ===== */
document.addEventListener("mousemove",e=>{
  const glow=document.createElement("div");
  glow.style.position="fixed";
  glow.style.left=e.clientX+"px";
  glow.style.top=e.clientY+"px";
  glow.style.width="10px";
  glow.style.height="10px";
  glow.style.background="#ff0088";
  glow.style.borderRadius="50%";
  glow.style.boxShadow="0 0 20px #ff0088";
  glow.style.pointerEvents="none";
  document.body.appendChild(glow);

  setTimeout(()=>glow.remove(),300);
});

</script>

</body>
</html>
